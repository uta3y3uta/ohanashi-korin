<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>おはなしコロリン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<script>
  (function () {
    const t = Date.now();
    document.write(
      '<link rel="stylesheet" href="style.css?t=' + t + '">' +
      '<script src="data.js?t=' + t + '"><\/script>' +
      '<script src="data-where.js?t=' + t + '"><\/script>' +
      '<script src="data-who.js?t=' + t + '"><\/script>' +
      '<script src="data-what.js?t=' + t + '"><\/script>' +
      '<script src="data-connector.js?t=' + t + '"><\/script>' +
      '<script src="app.js?t=' + t + '"><\/script>'
    );
  })();
</script>
</head>
<body>

<!-- ===================== 本番（プレイ）モード ===================== -->
<div id="playView" class="view">
  <header class="play-header">
    <h1 class="play-title kirby-title">
      <span class="c1">お</span><span class="c2">は</span><span class="c3">な</span><span class="c4">し</span><span class="c1">コ</span><span class="c2">ロ</span><span class="c3">リ</span><span class="c4">ン</span>
    </h1>
  </header>

  <main class="play-main">

    <!-- ===== フェーズ1：4つのサイコロでお話のはじまりを決める ===== -->
    <section id="setupPhase" class="phase setup-phase">
      <div class="setup-grid">
        <div class="setup-cell" data-cat="when">
          <div class="setup-label">いつ</div>
          <div class="slot-frame setup-frame">
            <div id="slotWhen" class="setup-slot empty"><div class="slot-inner">―</div></div>
          </div>
        </div>
        <div class="setup-cell" data-cat="where">
          <div class="setup-label">どこで</div>
          <div class="slot-frame setup-frame">
            <div id="slotWhere" class="setup-slot empty"><div class="slot-inner">―</div></div>
          </div>
        </div>
        <div class="setup-cell" data-cat="who">
          <div class="setup-label">だれが</div>
          <div class="slot-frame setup-frame">
            <div id="slotWho" class="setup-slot empty"><div class="slot-inner">―</div></div>
          </div>
        </div>
        <div class="setup-cell" data-cat="what">
          <div class="setup-label">なにをした</div>
          <div class="slot-frame setup-frame">
            <div id="slotWhat" class="setup-slot empty"><div class="slot-inner">―</div></div>
          </div>
        </div>
      </div>

      <div class="action-row">
        <button id="setupNextBtn" class="btn btn-kirby-red btn-mega">次へ</button>
        <button id="setupRerollBtn" class="btn btn-kirby-yellow btn-mega hidden">もう一度</button>
      </div>
    </section>

    <!-- ===== フェーズ2：接続詞ループ（メイン機能） ===== -->
    <section id="connectorPhase" class="phase connector-phase hidden">

      <div class="story-recap">
        <div class="recap-item"><span class="recap-tag">いつ</span><span id="recapWhen" class="recap-text">―</span></div>
        <div class="recap-item"><span class="recap-tag">どこで</span><span id="recapWhere" class="recap-text">―</span></div>
        <div class="recap-item"><span class="recap-tag">だれが</span><span id="recapWho" class="recap-text">―</span></div>
        <div class="recap-item"><span class="recap-tag">なにをした</span><span id="recapWhat" class="recap-text">―</span></div>
      </div>

      <div class="slot-frame play-frame">
        <div id="connectorSlot" class="play-window"><div class="slot-inner">「<ruby>次<rt>つぎ</rt></ruby>へ」を<ruby>押<rt>お</rt></ruby>してね</div></div>
      </div>

      <div class="punchline-counter-wrap">
        <button type="button" id="btnPunchDown" class="punch-arrow" aria-label="へらす">↓</button>
        <div class="punchline-counter">
          オチまであと <span id="remainingCount">8</span> <ruby>回<rt>かい</rt></ruby>
        </div>
        <button type="button" id="btnPunchUp" class="punch-arrow" aria-label="ふやす">↑</button>
      </div>

      <div class="action-row">
        <button id="connectorNextBtn" class="btn btn-kirby-red btn-mega">次へ</button>
        <button id="connectorRerollBtn" class="btn btn-kirby-yellow btn-mega hidden">もう一度</button>
      </div>
    </section>

    <!-- ===== フェーズ3：ふりかえり ===== -->
    <section id="reviewPhase" class="phase review-phase hidden">
      <div class="review-card">
        <h2 class="review-heading">お<ruby>話<rt>はなし</rt></ruby>のはじまり</h2>
        <div class="review-story">
          <div class="review-line"><span class="review-tag">いつ</span><span id="reviewWhen" class="review-text">―</span></div>
          <div class="review-line"><span class="review-tag">どこで</span><span id="reviewWhere" class="review-text">―</span></div>
          <div class="review-line"><span class="review-tag">だれが</span><span id="reviewWho" class="review-text">―</span></div>
          <div class="review-line"><span class="review-tag">なにをした</span><span id="reviewWhat" class="review-text">―</span></div>
        </div>

        <h2 class="review-heading">つかった<ruby>接続詞<rt>せつぞくし</rt></ruby></h2>
        <ol id="reviewConnectorList" class="review-connector-list"></ol>

        <p class="review-tip"><ruby>考<rt>かんが</rt></ruby>えたお<ruby>話<rt>はなし</rt></ruby>を<ruby>振<rt>ふ</rt></ruby>り<ruby>返<rt>かえ</rt></ruby>って<ruby>楽<rt>たの</rt></ruby>しもう♪</p>

        <div class="action-row">
          <button id="reviewRestartBtn" class="btn btn-kirby-green btn-big">はじめから</button>
        </div>
      </div>
    </section>

  </main>
</div>

</body>
</html>
